[dependency-groups]
runtime = [
    "PySide6==6.11.2",
    "jeepney==0.9.0",
]
dev = [
    { include-group = "runtime" },
    "pytest==8.4.2",
    "ruff==0.13.2",
    "iniconfig==2.3.0",
    "packaging==26.3",
    "pluggy==1.6.0",
    "Pygments==2.21.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
