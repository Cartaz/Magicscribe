name: CI

on:
  push:
    branches: [main, "migration/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Verify PySide6 and Qt
        run: |
          python - <<'PY'
          from PySide6.QtCore import qVersion
          from PySide6.QtQml import QQmlApplicationEngine
          from PySide6.QtWidgets import QApplication

          version = tuple(int(part) for part in qVersion().split(".")[:3])
          assert version >= (6, 11, 0), qVersion()
          assert QQmlApplicationEngine is not None
          assert QApplication is not None
          print(f"Qt {qVersion()} / PySide6 runtime OK")
          PY

      - name: Compile Python sources
        run: python -m compileall -q config core ui main.py

      - name: Run tests
        run: python -m pytest -q
