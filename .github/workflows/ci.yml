name: CI

on:
  push:
    branches: [main, "migration/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Verify PySide6, Qt and D-Bus runtime
        run: |
          python - <<'PY'
          from PySide6.QtCore import qVersion
          from PySide6.QtQml import QQmlApplicationEngine
          from PySide6.QtWidgets import QApplication
          import jeepney

          version = tuple(int(part) for part in qVersion().split(".")[:3])
          assert version >= (6, 11, 0), qVersion()
          assert QQmlApplicationEngine is not None
          assert QApplication is not None
          assert jeepney is not None
          print(f"Qt {qVersion()} / PySide6 runtime OK (Jeepney D-Bus available)")
          PY

      - name: Validate shell syntax
        run: bash -n install.sh scripts/local_desktop_gate.sh

      - name: Compile Python sources
        run: python -m compileall -q config core ui scripts main.py

      - name: Lint QML
        run: pyside6-qmllint --max-warnings 0 -I ui/qml ui/qml/MagicScribe/*.qml

      - name: Run tests
        run: python -m pytest -q
