name: CI

on:
  push:
    branches: [main, "refactor/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libgl1 \
            libwayland-client0 \
            libxkbcommon0

      - name: Install pinned development environment
        run: |
          python -m pip install "pip==26.2.1"
          python -m pip install --group ./pyproject.toml:dev
          python -m pip check

      - name: Verify PySide6, Qt, Wayland and D-Bus runtime
        run: |
          python - <<'PY'
          import ctypes.util
          import sys
          from pathlib import Path

          from PySide6.QtCore import QLibraryInfo, qVersion
          from PySide6.QtQml import QQmlApplicationEngine
          from PySide6.QtWidgets import QApplication
          import jeepney

          version = tuple(int(part) for part in qVersion().split(".")[:3])
          assert version >= (6, 11, 0), qVersion()
          assert QQmlApplicationEngine is not None
          assert QApplication is not None
          assert jeepney is not None

          plugins_root = Path(QLibraryInfo.path(QLibraryInfo.LibraryPath.PluginsPath))
          wayland_plugins = sorted((plugins_root / "platforms").glob("libqwayland*.so"))
          assert wayland_plugins, plugins_root / "platforms"
          assert ctypes.util.find_library("wayland-client") is not None
          assert ctypes.util.find_library("xkbcommon") is not None

          print(
              f"Python {sys.version.split()[0]} / Qt {qVersion()} / "
              f"Wayland QPA {len(wayland_plugins)} plugin(s) / Jeepney OK"
          )
          PY

      - name: Validate shell syntax
        run: bash -n install.sh scripts/local_desktop_gate.sh

      - name: Lint Python
        run: python -m ruff check config core ui scripts main.py

      - name: Compile Python sources
        run: python -m compileall -q config core ui scripts main.py

      - name: Lint portable QML
        run: |
          mapfile -d '' qml_files < <(
            find ui/qml/MagicScribe -maxdepth 1 -type f -name '*.qml' \
              ! -name 'Wayland*.qml' -print0
          )
          pyside6-qmllint --max-warnings 0 -I ui/qml "${qml_files[@]}"

      - name: Run tests
        run: python -m pytest -q

      - name: Observe renderer performance
        run: python scripts/benchmark_renderer.py --quick
