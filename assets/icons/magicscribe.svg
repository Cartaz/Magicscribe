      <circle cx="310" cy="130" r="2" fill="#9C27B0" opacity="0.45"/>
      <circle cx="390" cy="150" r="2" fill="#E91E63" opacity="0.55"/>
      <circle cx="395" cy="220" r="2.5" fill="#3F51B5" opacity="0.5"/>
      <circle cx="380" cy="265" r="2" fill="#FF9800" opacity="0.5"/>
      <circle cx="280" cy="260" r="2.5" fill="#FF9800" opacity="0.55"/>
      <circle cx="350" cy="240" r="2" fill="#F44336" opacity="0.5"/>
      <circle cx="160" cy="260" r="2" fill="#9C27B0" opacity="0.4"/>
      <circle cx="120" cy="250" r="1.5" fill="#E91E63" opacity="0.4"/>
      <circle cx="220" cy="110" r="1.5" fill="#3F51B5" opacity="0.4"/>
      <circle cx="290" cy="145" r="2" fill="#E91E63" opacity="0.5"/>
      <circle cx="360" cy="135" r="1.8" fill="#F44336" opacity="0.45"/>
