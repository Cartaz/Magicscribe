      <line x1="47" y1="-6" x2="47" y2="6" stroke="#555" stroke-width="0.8" opacity="0.4"/>
      <line x1="51" y1="-6" x2="51" y2="6" stroke="#555" stroke-width="0.8" opacity="0.4"/>
      <line x1="55" y1="-6" x2="55" y2="6" stroke="#555" stroke-width="0.8" opacity="0.4"/>
      <line x1="59" y1="-6" x2="59" y2="6" stroke="#555" stroke-width="0.8" opacity="0.4"/>
      <line x1="63" y1="-6" x2="63" y2="6" stroke="#555" stroke-width="0.8" opacity="0.4"/>
