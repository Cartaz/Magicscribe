<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 64 64" role="img" aria-label="MagicScribe icon">
  <!-- App icon (.desktop, tray, window): the toolbar logo button as an image.
       The "mark" group is copied verbatim from toolbar/logo.svg. No filters,
       so it stays sharp from 16 px up. -->
  <defs>
    <linearGradient id="frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6a717d"/>
      <stop offset="1" stop-color="#3c424d"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb000"/>
      <stop offset="1" stop-color="#ff6a00"/>
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="29.5" fill="none" stroke="#ff6600" stroke-opacity=".22" stroke-width="4"/>
  <circle cx="32" cy="32" r="28" fill="#141414" stroke="#ff6600" stroke-width="1.6"/>
  <g transform="translate(12 12) scale(1.25)">
    <g id="mark">
      <rect x="3" y="7" width="23" height="16" rx="3" fill="url(#frame)"/>
      <rect x="5" y="9" width="19" height="12" rx="1.5" fill="#0c0f15"/>
      <path d="M13 23h3l.6 2.6h-4.2z" fill="#4a505b"/>
      <rect x="10" y="25.3" width="9" height="1.9" rx=".95" fill="#565d68"/>
      <path d="M7.4 16.4c2-2.6 4.1-3.6 5.3-3.1 1.1.5.2 2-.4 2.9-.6 1-.1 1.8 1.2 1.8 2 0 4.3-1.1 5.6-2"
            fill="none" stroke="url(#ink)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
      <g transform="translate(27.6 3.2) rotate(38)">
        <rect x="-2.6" y="-.4" width="5.2" height="11.6" rx="2.6" fill="#141414"/>
        <rect x="-2" y="0" width="4" height="10.4" rx="2" fill="#8a919c"/>
        <rect x="-2" y="1.6" width="4" height="1.8" fill="#ff8a00"/>
        <path d="M-2 10.2h4l-2 3.6z" fill="#ffb000" stroke="#141414" stroke-width=".6" stroke-linejoin="round"/>
      </g>
    </g>
  </g>
</svg>
